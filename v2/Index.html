<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTRANCE</title>
    <link rel="stylesheet" href="../docs/v2/style.css" type="text/css">
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
</head>

<body>
    <div class="eyecenter">
        <div class="eye-stack" id="eye-stack">
            <img id="eye-base" src="../docs/v2/Media/Eyes/Eye.png" class="eye eye-base breathing" style="--breath-seed: 1; --breath-scale: 0.95; --breath-distance: 5px; --breath-tilt: 1deg; --breath-duration: 1000; --breath-scale-pulse: 0.012; --breath-jitter: 0.5;">
            <div id="eye-pupil" class="eye-pupil breathing" style="--breath-seed: 3; --breath-scale: 0.95; --breath-distance: 5px; --breath-tilt: 0deg; --breath-duration: 1000; --breath-scale-pulse: 0.012; --breath-jitter: 0.55;">
                <img src="../docs/v2/Media/Eyes/Pupil.png" class="pupil-image" alt="">
            </div>
        </div>
    </div>
    <script src="scripts/breathing.js"></script>
    <script src="scripts/lookat.js"></script>
</body>

</html>
